name: Release Module on Steam

on:
  workflow_call:
    inputs:
      workshop_id:
        required: true
        type: number
        default: -1
      mod_id:
        required: true
        type: string
      mod_description:
        required: false
        type: string
        default: ''
      artifact_name:
        required: true
        type: string
    secrets:
      STEAM_LOGIN:
        required: true
      STEAM_AUTH_CODE:
        required: true
      STEAM_PASSWORD:
        required: true

jobs:
  publish-on-steam:
    name: Publish Module on Steam
    runs-on: ubuntu-latest
    environment:
      name: Steam Workshop
      url: https://steamcommunity.com/sharedfiles/filedetails/?id=${{ inputs.workshop_id }}
    steps:
    
    - name: Setup
      uses: butr/actions-common-setup@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download Module artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ./artifact
      continue-on-error: true

    - name: Download Module artifact Pattern
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact_name }}-*
        merge-multiple: true
        path: ./artifact
      continue-on-error: true

    - name: Install Bannerlord.ChangelogParser
      if: ${{ inputs.mod_description == '' }}
      run: dotnet tool install -g Bannerlord.ChangelogParser;
      shell: pwsh

    # The description comes from a changelog, it goes through env so quotes, backticks and $ in it aren't run as shell
    - name: Set Description
      id: set_description
      env:
        MOD_DESCRIPTION: ${{ inputs.mod_description }}
      run: |
        if [ -z "$MOD_DESCRIPTION" ]
        then
          desc="$(bannerlord_changelog_parser fulldescription -f "$PWD/changelog.txt")"
        else
          desc="$MOD_DESCRIPTION"
        fi
        # A random delimiter, so no line of the description can end the value early
        eof="EOF_$(openssl rand -hex 16)"
        {
          echo "mod_description<<$eof"
          echo "$desc"
          echo "$eof"
        } >> "$GITHUB_OUTPUT"

    - uses: CyberAndrii/setup-steamcmd@v1

    - name: Install Bannerlord.SteamWorkshop
      run: dotnet tool install -g Bannerlord.SteamWorkshop;
      shell: pwsh

    - env:
        STEAM_LOGIN: ${{ secrets.STEAM_LOGIN }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        STEAM_AUTH_CODE: ${{ secrets.STEAM_AUTH_CODE }}
        WORKSHOP_ID: ${{ inputs.workshop_id }}
        MOD_ID: ${{ inputs.mod_id }}
        MOD_DESCRIPTION: ${{ steps.set_description.outputs.mod_description }}
      run: |
        bannerlord_steam_workshop loginandpublish -l $env:STEAM_LOGIN -p $env:STEAM_PASSWORD -t $env:STEAM_AUTH_CODE -f $env:WORKSHOP_ID -c "$env:GITHUB_WORKSPACE/artifact/Modules/$env:MOD_ID" -d $env:MOD_DESCRIPTION;
      shell: pwsh
