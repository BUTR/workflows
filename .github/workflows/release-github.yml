name: Release Module on GitHub

on:
  workflow_call:
    inputs:
      mod_id:
        required: true
        type: string
      mod_version:
        required: false
        type: string
        default: ''
      mod_description:
        required: false
        type: string
        default: ''
      artifact_name:
        required: true
        type: string

jobs:
  publish-on-github:
    name: Publish Module on GitHub
    runs-on: ubuntu-latest
    environment:
      name: GitHub Release
      url: ${{ steps.upload_release_asset.outputs.browser_download_url }}
    steps:
    
    - name: Setup
      uses: butr/actions-common-setup@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download Module artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ./artifact
      continue-on-error: true

    - name: Download Module artifact Pattern
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact_name }}-*
        merge-multiple: true
        path: ./artifact
      continue-on-error: true

    - name: 7z Module
      run: 7z a -t7z ${{ inputs.mod_id }}.7z ./artifact/* -mx9
      #shell: pwsh
      # pwsh casues it to include the root folder

    - name: Install Bannerlord.ChangelogParser
      if: ${{ inputs.mod_version == '' || inputs.mod_description == '' }}
      run: dotnet tool install -g Bannerlord.ChangelogParser;
      shell: pwsh

    # The inputs come from changelogs, they go through env so quotes, backticks and $ in them aren't run as shell
    - name: Set Version
      id: set_version
      env:
        MOD_VERSION: ${{ inputs.mod_version }}
      run: |
        if [ -z "$MOD_VERSION" ]
        then
          vers="$(bannerlord_changelog_parser latestversion -f "$PWD/changelog.txt")"
        else
          vers="$MOD_VERSION"
        fi
        echo "mod_version=$vers" >> "$GITHUB_OUTPUT"

    - name: Set Description
      id: set_description
      env:
        MOD_DESCRIPTION: ${{ inputs.mod_description }}
      run: |
        if [ -z "$MOD_DESCRIPTION" ]
        then
          desc="$(bannerlord_changelog_parser fulldescription -f "$PWD/changelog.txt")"
        else
          desc="$MOD_DESCRIPTION"
        fi
        # A random delimiter, so no line of the description can end the value early
        eof="EOF_$(openssl rand -hex 16)"
        {
          echo "mod_description<<$eof"
          echo "$desc"
          echo "$eof"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      with:
        tag_name: v${{ steps.set_version.outputs.mod_version }}
        release_name: Release ${{ steps.set_version.outputs.mod_version }}
        body: ${{ steps.set_description.outputs.mod_description }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset
      id: upload_release_asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ inputs.mod_id }}.7z
        asset_name: ${{ inputs.mod_id }}.7z
        asset_content_type: application/x-7z-compressed
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
