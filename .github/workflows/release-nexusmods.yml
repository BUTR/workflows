name: Release Module on NexusMods

on:
  workflow_call:
    inputs:
      nexusmods_game_id:
        required: true
        type: string
      nexusmods_mod_id:
        required: true
        type: string
      nexusmods_file_group_id:
        required: true
        type: string
      mod_filename:
        required: true
        type: string
      mod_version:
        required: false
        type: string
        default: ""
      mod_description:
        required: false
        type: string
        default: ""
      artifact_name:
        required: true
        type: string
      mod_description_full:
        required: false
        type: boolean
        default: true
      # The mod page shows its own version, the upload only changes it when asked to
      update_mod_version:
        required: false
        type: boolean
        default: true
      # A previous version keeps the primary flag unless the new upload takes it, and mod managers download the primary file
      primary_mod_manager_download:
        required: false
        type: boolean
        default: true
    secrets:
      NEXUSMODS_APIKEY:
        required: true

jobs:
  publish-on-nexusmods:
    name: Publish Module on NexusMods
    runs-on: ubuntu-latest
    environment:
      name: NexusMods
      url: https://www.nexusmods.com/${{ inputs.nexusmods_game_id }}/mods/${{ inputs.nexusmods_mod_id }}
    steps:
      - name: Setup
        uses: butr/actions-common-setup@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Module artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ./artifact
        continue-on-error: true

      - name: Download Module artifact Pattern
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_name }}-*
          merge-multiple: true
          path: ./artifact
        continue-on-error: true

      - name: 7z Module
        run: 7z a -t7z "${{ inputs.mod_filename }}.7z" ./artifact/* -mx9

      - name: Install Bannerlord.ChangelogParser
        if: ${{ inputs.mod_description == '' }}
        run: dotnet tool install -g Bannerlord.ChangelogParser;
        shell: pwsh

      # The inputs come from changelogs, they go through env so quotes, backticks and $ in them aren't run as shell
      - name: Set Version
        id: set_version
        env:
          MOD_VERSION: ${{ inputs.mod_version }}
        run: |
          if [ -z "$MOD_VERSION" ]
          then
            vers="$(bannerlord_changelog_parser latestversion -f "$PWD/changelog.txt")"
          else
            vers="$MOD_VERSION"
          fi
          echo "mod_version=$vers" >> "$GITHUB_OUTPUT"

      - name: Set Description
        id: set_description
        env:
          MOD_DESCRIPTION: ${{ inputs.mod_description }}
        run: |
          if [ -z "$MOD_DESCRIPTION" ]
          then
            desc="$(bannerlord_changelog_parser ${{ inputs.mod_description_full && 'fulldescription' || 'description' }} -f "$PWD/changelog.txt")"
          else
            desc="$MOD_DESCRIPTION"
          fi
          # The changelog is the description without its 'For ...' header line and without the '* ' bullets
          c_desc="$desc"
          if [[ "$c_desc" == For* ]]; then c_desc="${c_desc#*$'\n'}"; fi
          c_desc="${c_desc#'* '}"
          c_desc="${c_desc//$'\n* '/$'\n'}"
          # A random delimiter, so no line of the description can end the value early
          eof="EOF_$(openssl rand -hex 16)"
          {
            echo "mod_description<<$eof"
            echo "$desc"
            echo "$eof"
            echo "mod_changelog<<$eof"
            echo "$c_desc"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve NexusMods Mod UID
        id: resolve_mod_uid
        env:
          NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        run: |
          # The upload action's `mod_id` expects the v3 mod UID, not the game-scoped id from the URL.
          # The UID is only obtainable via the v3 API: GET /v3/games/{game_domain}/mods/{game_scoped_id}
          url="https://api.nexusmods.com/v3/games/${{ inputs.nexusmods_game_id }}/mods/${{ inputs.nexusmods_mod_id }}"
          uid="$(curl -sSf -H "apikey: $NEXUSMODS_APIKEY" -H "Accept: application/json" "$url" | jq -r '.data.id')"
          if [ -z "$uid" ] || [ "$uid" = "null" ]; then
            echo "::error::Failed to resolve NexusMods mod UID for ${{ inputs.nexusmods_game_id }}/mods/${{ inputs.nexusmods_mod_id }}"
            exit 1
          fi
          echo "mod_uid=$uid" >> "$GITHUB_OUTPUT"

      - name: Upload to NexusMods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ inputs.nexusmods_file_group_id }}
          filename: ${{ inputs.mod_filename }}.7z
          version: ${{ steps.set_version.outputs.mod_version }}
          display_name: ${{ inputs.mod_filename }}
          description: ${{ steps.set_description.outputs.mod_description }}
          category: main
          update_mod_version: ${{ inputs.update_mod_version }}
          primary_mod_manager_download: ${{ inputs.primary_mod_manager_download }}
          mod_id: ${{ steps.resolve_mod_uid.outputs.mod_uid }}
          changelog: ${{ steps.set_description.outputs.mod_changelog }}
